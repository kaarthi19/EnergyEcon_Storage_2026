[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bessbid"
version = "1.0.0"
license = {text = "MIT"}
authors = [{name = "Kaarthi A Gnapathy"}]
description = "Bid generation for EMA's BESS bidding hackathon (November 2026)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=14",
    "openpyxl>=3.1",
    "lxml>=5",
    "highspy>=1.7",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest>=8"]
figures = ["matplotlib>=3.8"]

[project.scripts]
bessbid = "bessbid.cli:main"

[tool.setuptools]
packages = ["bessbid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = [
    "data: needs EMA's data (set BESSBID_DATA_DIR)",
    "slow: full-length data runs (deselect with -m \"not slow\")",
]
